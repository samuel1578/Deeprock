<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
    <pattern id="fractures" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 0 50 L 50 40 L 80 70 L 120 60 L 150 90 L 200 80" fill="none" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.15"/>
      <path d="M 30 0 L 40 60 L 20 110 L 60 160 L 50 200" fill="none" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.15"/>
      <path d="M 100 0 L 110 40 M 110 80 L 100 130 L 120 200" fill="none" stroke="currentColor" stroke-width="0.3" stroke-opacity="0.1"/>
      <circle cx="150" cy="150" r="1" fill="currentColor" fill-opacity="0.2"/>
      <circle cx="50" cy="50" r="0.5" fill="currentColor" fill-opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />
  <rect width="100%" height="100%" fill="url(#fractures)" />
</svg>
